# CI for this repository itself. The guards are plain bash, so these run in
# seconds without a Lean toolchain.

name: Guard tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run guard tests
        run: |
          chmod +x tests/run_tests.sh *.sh
          ./tests/run_tests.sh
